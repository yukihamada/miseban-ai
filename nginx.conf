worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Temp paths for non-root operation
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # Stable filenames must revalidate; errors and authenticated API responses
    # must never inherit the public asset cache policy.
    map $uri $asset_cache {
        default "no-cache, must-revalidate";
        ~^/api/ "no-store, private";
        ~*\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ "public, max-age=3600, must-revalidate";
    }
    map $status $response_cache {
        default "no-store";
        200 $asset_cache;
        304 $asset_cache;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        port_in_redirect off;
        absolute_redirect off;

        # Preserve the live scanner exclusions.
        location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php|\.env|\.git|vendor|admin\.php|install\.php|setup-config\.php) {
            access_log off;
            return 444;
        }
        location ~* \.(php|asp|aspx|cgi|pl)$ {
            access_log off;
            return 444;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Existing static/dynamic onclick handlers require inline scripts. No
        # first-party script uses eval; do not grant unsafe-eval globally.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://enabler-analytics.fly.dev https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.google.com https://ad.doubleclick.net https://stats.g.doubleclick.net https://enabler-analytics.fly.dev https://cloudflareinsights.com; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Cache-Control $response_cache always;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
        }

        # API reverse proxy to Rust backend (miseban-ai-api)
        location ^~ /api/ {
            proxy_pass https://miseban-ai-api.fly.dev;
            proxy_set_header Host miseban-ai-api.fly.dev;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }

        # Dashboard SPA
        location /dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            try_files $uri $uri/ /dashboard/index.html;

            # Inherit the same policy as the landing and all static assets.
        }

        # Custom error page
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Static site: serve files directly, return 404 for missing pages
        location / {
            try_files $uri $uri/ =404;
        }

        # Health check endpoint
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }
    }
}
