name: Deploy — misebanai.com

# Tests → API and audited web overlay → production GET verification.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────────────────
  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # ─────────────────────────────────────────────
  # Job 2a: Verify the live baseline used by the narrow web overlay.
  # ─────────────────────────────────────────────
  deploy-gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preserved live landing baseline
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://misebanai.com/ -o /tmp/miseban-home.html
          echo "b25a5cefa4d387612886f000152d146a80e353c4b1815b8c528345bd0a455f4a  /tmp/miseban-home.html" | sha256sum --check

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: deploy-gate
    concurrency:
      group: deploy-miseban-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy existing API without schema migrations
        run: flyctl deploy --config fly.api.toml --dockerfile Dockerfile.api --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_APP_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2b: Deploy (web — Dockerfile.web → miseban-ai)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: deploy-api
    concurrency:
      group: deploy-miseban-web
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: flyctl deploy (web)
        run: flyctl deploy --config fly.web.toml --dockerfile Dockerfile.web.audit --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3: Verify (production smoke test)
  # ─────────────────────────────────────────────
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Wait for rollout to settle
        run: sleep 20

      - name: curl homepage 200 + analytics tag present
        run: |
          set -euo pipefail
          body="$(curl -fsS https://misebanai.com/)"
          if ! grep -q "enabler-analytics" <<< "$body"; then
            echo "::error::misebanai.com is up but the enabler-analytics tag is missing."
            exit 1
          fi
          echo "OK — misebanai.com returned 200 and carries the enabler-analytics tag."
      - name: Verify dashboard bytes and API health
        run: |
          set -euo pipefail
          curl -fsS https://misebanai.com/dashboard/ -o /tmp/dashboard.html
          cmp web/dashboard/index.html /tmp/dashboard.html
          curl -fsS https://misebanai.com/privacy.html -o /tmp/privacy.html
          cmp web/landing/privacy.html /tmp/privacy.html
          curl -fsS https://miseban-ai-api.fly.dev/api/v1/health -o /tmp/health.json
          python3 -c 'import json; h=json.load(open("/tmp/health.json")); assert h["status"] == "ok" and h["database"] == "connected", h'
