name: Deploy — misebanai.com

# Buildable-scope test → web deploy → production verify.
#
# NOTE: the `api` crate does not build on master (broken since 2026-03-11),
# so this pipeline only tests the `shared` crate (which builds cleanly).
# The full workspace build/clippy/security suite lives in ci.yml.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Test (buildable scope only)
  # ─────────────────────────────────────────────
  test:
    name: Test (shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p shared --locked
        run: cargo test -p shared --locked

  # ─────────────────────────────────────────────
  # Job 2a: Deploy gate
  # misebanai.com's live landing page carries the enabler-analytics tag and
  # ~192 lines of landing work that currently exist ONLY in an uncommitted
  # 2-month-old WIP — NOT in master. Deploying master as-is would regress
  # production (drop the tag + the landing work). So we only run the actual
  # deploy when the checked-out index.html already carries that tag; otherwise
  # the deploy/verify jobs skip (neutral, master stays green) instead of
  # shipping a regression. Once the WIP (or an equivalent fix) lands the tag on
  # master, the deploy → verify chain runs and goes green end-to-end.
  # ─────────────────────────────────────────────
  deploy-gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    needs: test
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check landing page carries enabler-analytics tag
        id: check
        run: |
          if grep -q "enabler-analytics" web/landing/index.html; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Landing page carries the enabler-analytics tag — will deploy."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::web/landing/index.html is missing the enabler-analytics tag (it lives only in the uncommitted WIP). Skipping deploy to avoid a production regression."
          fi

  # ─────────────────────────────────────────────
  # Job 2b: Deploy (web — Dockerfile.web → miseban-ai)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: deploy-gate
    if: needs.deploy-gate.outputs.deployable == 'true'
    concurrency:
      group: deploy-miseban-web
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: flyctl deploy (web)
        run: flyctl deploy --config fly.web.toml --dockerfile Dockerfile.web --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3: Verify (production smoke test)
  # ─────────────────────────────────────────────
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for rollout to settle
        run: sleep 20

      - name: curl homepage 200 + analytics tag present
        run: |
          set -euo pipefail
          body="$(curl -fsS https://misebanai.com/)"
          if ! printf '%s' "$body" | grep -q "enabler-analytics"; then
            echo "::error::misebanai.com is up but the enabler-analytics tag is missing."
            exit 1
          fi
          echo "OK — misebanai.com returned 200 and carries the enabler-analytics tag."
